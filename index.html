<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>加载中...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff;
      overflow: hidden;
    }
    .gif-container img {
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <div class="gif-container">
    <!-- 注意这里，直接用相对路径 bg.gif 最稳妥，不要用 github.com 的链接 -->
    < img src="bg.gif" alt="加载中">
  </div>

  <script>
    // 3秒后跳转
    setTimeout(function () {
      window.location.href = "https://www.cuc.edu.cn";
    }, 3000);
  </script>

</body>
</html>
